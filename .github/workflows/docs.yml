name: Documentation

on:
  push:
    tags:
      - 'v*'
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'docs/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, needed to check that the tag is on main

      # Only tags pointing to a commit that is reachable from main may be released.
      - name: Verify tag is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag '$GITHUB_REF_NAME' ($GITHUB_SHA) is not on the main branch."
            echo "Merge the commit into main and push the tag again."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      
      - name: Restore tools
        run: dotnet tool restore
      
      - name: Restore project dependencies
        run: dotnet restore src/AsmLocator.slnx
        
      # Build Core for the framework used by DocFX.
      - name: Build Core
        run: dotnet build src/AsmLocator/AsmLocator.csproj --configuration Release --framework net10.0

      - name: Generate API Metadata
        run: dotnet docfx metadata docs/docfx.json

      - name: Build Documentation
        run: dotnet docfx build docs/docfx.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      
      - name: Upload Documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5