name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AsmLocator.slnx

      - name: Build
        run: dotnet build src/AsmLocator.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/AsmLocator.slnx --no-build --configuration Release
